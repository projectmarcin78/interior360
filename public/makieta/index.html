function render(){document.documentElement.lang=lang;document.body.className=tab==='konsultacje'?'consult-theme':'';document.querySelectorAll('[data-tab]').forEach(x=>{const active=x.dataset.tab===tab;x.classList.toggle('active',active);if(active)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});$('[data-label="consultations"]').textContent=T('KONSULTACJE','CONSULTATIONS');document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));$('#contactBar').innerHTML=contactBar();$('#waLabel').textContent=T('Napisz na WhatsApp','Chat on WhatsApp');$('#wa').href=wa(T('Cześć, piszę ze strony interior360.','Hello, I’m contacting you from interior360.'));$('#main').innerHTML=tab==='youtube'?youtube():tab==='konsultacje'?consultations():interior();bind()}
function interior(){return `<div class="toolbar"><div class="gallery-heading"><h1>Portfolio</h1><p>${T('Projektowanie wnętrz i koordynacja remontu.','Interior design and renovation coordination.')}</p></div><span class="hint">${T('Najedź, by odkryć kolory. Kliknij, by zajrzeć do środka.','Hover to reveal the colours. Click to step inside.')}</span></div><section class="grid" aria-label="Portfolio">${projects.map(p=>{const n=slide[p.id]||0;return `<article class="card"><div class="picture" data-project="${p.id}"><img src="${photo(images[p.photos[n]])}" alt="${L(p.title)} — ${T('zdjęcie demonstracyjne','illustrative image')}" ${p===projects[0]?'fetchpriority="high"':'loading="lazy"'}><button class="open-project" data-open="${p.id}" aria-label="${T('Otwórz projekt','Open project')}: ${L(p.title)}"><span class="project-tag">INTERIOR360</span></button><button class="pic-arrow prev" data-slide="${p.id}" data-dir="-1" aria-label="${T('Poprzednie zdjęcie','Previous photo')}">←</button><span class="photo-count">${n+1} / ${p.photos.length}</span><button class="pic-arrow next" data-slide="${p.id}" data-dir="1" aria-label="${T('Następne zdjęcie','Next photo')}">→</button></div><a href="#interior360/${p.id}" class="card-meta"><div><h3>${L(p.title)}</h3><p>${L(p.type)}</p></div><span class="arrow">↗</span></a></article>`}).join('')}</section><p class="demo">${T('MAKIETA / Zdjęcia Unsplash i nazwy projektów są przykładowe.','PROTOTYPE / Unsplash images and project names are illustrative.')}</p>`}
function youtube(){return `<div class="toolbar"><div class="gallery-heading"><h1>${T('Najnowsze odcinki','Latest episodes')}</h1></div><a class="pill-link" href="${CONFIG.channel}" target="_blank" rel="noopener">YouTube ↗</a></div><section class="grid" aria-label="YouTube">${videos.map(v=>`<article class="card"><div class="picture" data-video="${v.index}"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${escapeHTML(v.title)}" loading="lazy"><button class="open-project" data-play="${v.index}" aria-label="${T('Odtwórz film','Play video')}: ${escapeHTML(v.title)}"><span class="project-tag">MIRELLA I MARCIN</span></button><span class="play">▶</span></div><a href="https://www.youtube.com/watch?v=${v.id}" class="card-meta" target="_blank" rel="noopener"><div><h3>${escapeHTML(v.title)}</h3><p>${T('Mirella i Marcin · zobacz na YouTube','Mirella i Marcin · watch on YouTube')}</p></div><span class="arrow">↗</span></a></article>`).join('')}</section><p class="demo">${T('Odcinki z kanału Mirella i Marcin · wybór z 23.10.2026. Podgląd po najechaniu: bez dźwięku.','Episodes from Mirella i Marcin · selection from 23 October 2026. Hover preview: muted.')}</p>`}
function consultations(){const ready=Boolean(CONFIG.bookingUrl);const video=CONFIG.consultationVideoUrl?`<iframe src="${CONFIG.consultationVideoUrl}" title="${T('Mirella wyjaśnia konsultacje online','Mirella explains online consultations')}" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`:`<div class="video-placeholder"><div><div class="video-circle" aria-hidden="true">▶</div><strong>${T('Mirella o konsultacjach','Mirella on consultations')}</strong><p>${T('Film w przygotowaniu','Video in preparation')}</p></div></div>`;return `<section class="consult-hero"><div><div class="eyebrow">${T('KONSULTACJE ONLINE Z MIRELLĄ','ONLINE CONSULTATIONS WITH MIRELLA')}</div><h1>${T('POROZMAWIAJMY O TWOIM WNĘTRZU.','LET’S TALK ABOUT YOUR INTERIOR.')}</h1><p class="consult-lead">${T('Masz pomysł na wnętrze, ale nie wiesz, od czego zacząć? A może potrzebujesz drugiego spojrzenia przed zakupami lub remontem? Podczas godzinnego spotkania online z Mirellą uporządkujesz pomysły i omówisz decyzje dotyczące swojego domu.','Have an idea for your interior but don’t know where to start? Or need a second opinion before shopping or renovating? During a one-hour online meeting with Mirella, you can organise your ideas and discuss decisions about your home.')}</p><div class="consult-facts"><span>60 ${T('minut','minutes')}</span><span>500 zł</span><span>${T('Online, z Twojego domu','Online, from your home')}</span></div><div class="consult-actions"><a class="pill-link primary" href="#rezerwacja">${T('Umów konsultację','Book a consultation')} ↗</a><a class="pill-link" href="#film">${T('Jak wygląda spotkanie?','How does it work?')} ↓</a></div><p class="consult-personal">${T('Jeśli potrzebujesz konsultacji osobistej, wymaga ona indywidualnej wyceny uwzględniającej koszty dojazdu.','If you need an in-person consultation, it requires an individual quote that includes travel expenses.')}</p></div><aside class="booking-card" id="rezerwacja"><div class="eyebrow">${T('TWOJA KONSULTACJA','YOUR CONSULTATION')}</div><div class="price">500 zł</div><div class="duration">${T('za 60-minutowe spotkanie online','for a 60-minute online meeting')}</div><h2>${T('Wybierz termin i zarezerwuj spotkanie','Choose a date and book your meeting')}</h2><p>${T('Rezerwacja i płatność online w jednym miejscu.','Booking and online payment in one place.')}</p>${ready?`<a class="pill-link primary" href="${CONFIG.bookingUrl}" target="_blank" rel="noopener">${T('Wybierz termin i zapłać','Choose a date and pay')} ↗</a>`:`<button class="pill-link" disabled>${T('Rezerwacja i płatność online — wkrótce','Online booking and payment — coming soon')}</button><p class="booking-note">${T('Do czasu uruchomienia kalendarza zapytaj o termin na WhatsApp.','Until the calendar is available, ask about a date on WhatsApp.')}</p>`}<a class="pill-link ${ready?'':'primary'}" href="${wa(T('Cześć, chcę umówić godzinne spotkanie online z Mirellą za 500 zł. Proszę o dostępne terminy. ','Hello, I’d like to book a one-hour online consultation with Mirella for PLN 500. Please let me know the available dates. ')+CONSULTATION_URL)}" target="_blank" rel="noopener">${T('Zapytaj o termin na WhatsApp','Ask about a date on WhatsApp')} ↗</a></aside></section><section class="consult-topics"><article class="topic"><h3>${T('Układ i codzienna wygoda','Layout and everyday comfort')}</h3><p>${T('Porozmawiajmy o funkcji pomieszczeń, ustawieniu mebli i tym, jak dopasować przestrzeń do domowników.','Discuss room functions, furniture layouts and adapting your space to the people who live there.')}</p></article><article class="topic"><h3>${T('Kolory, materiały, światło','Colours, materials and light')}</h3><p>${T('Omówimy Twoje inspiracje, paletę kolorów, oświetlenie i pomysły na wyposażenie.','Explore your inspirations, colour palette, lighting and furnishing ideas.')}</p></article><article class="topic"><h3>${T('Decyzje przed remontem','Decisions before renovating')}</h3><p>${T('Przyjrzymy się Twoim pytaniom i priorytetom, aby łatwiej ustalić, od czego zacząć i co zrobić dalej.','Look at your questions and priorities to work out where to start and which steps to take next.')}</p></article></section><section class="video-section" id="film">${video}<div class="video-copy"><h2 class="section-title">${T('Zobacz, jak wygląda konsultacja','See how a consultation works')}</h2><p>${T('Mirella opowie, jak przygotować się do spotkania, z jakimi pytaniami warto przyjść i jak wspólnie pracujemy nad Twoim wnętrzem.','Mirella will explain how to prepare for a meeting, which questions to bring and how we work together on your interior.')}</p><details><summary>${T('Co znajdzie się w filmie?','What will the video cover?')}</summary><p>${T('Krótka prezentacja Mirelli, przykładowe pytania o układ, kolory i wyposażenie, pokaz rozmowy na podstawie zdjęć lub rzutu oraz wyjaśnienie rezerwacji 60-minutowego spotkania za 500 zł.','A short introduction to Mirella, example questions about layouts, colours and furnishings, a demonstration using photos or a floor plan, and an explanation of booking a 60-minute meeting for PLN 500.')}</p></details></div></section><section class="steps"><h2 class="section-title">${T('Jak się przygotować?','How to prepare')}</h2><ol><li><strong>${T('Zbierz materiały','Gather your materials')}</strong><p>${T('Przygotuj zdjęcia wnętrza, dostępny rzut lub wymiary oraz kilka inspiracji.','Prepare photos of your interior, an available floor plan or measurements, and a few inspirations.')}</p></li><li><strong>${T('Wybierz najważniejsze pytania','Choose your main questions')}</strong><p>${T('Spisz tematy, które chcesz omówić. Dzięki temu dobrze wykorzystamy wspólną godzinę.','Write down what you want to discuss so we can make the most of our hour together.')}</p></li><li><strong>${T('Spotkajmy się online','Meet online')}</strong><p>${T('Po potwierdzeniu terminu ustalimy szczegóły połączenia. W trakcie rozmowy omówimy pomysły i kolejne kroki.','After confirming the appointment, we’ll agree on connection details. During the meeting, we’ll discuss ideas and next steps.')}</p></li></ol></section>`}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.hash='interior360/'+b.dataset.open);document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{const p=projects.find(p=>p.id===b.dataset.slide);slide[p.id]=((slide[p.id]||0)+Number(b.dataset.dir)+p.photos.length)%p.photos.length;render()});document.querySelectorAll('[data-project]').forEach(el=>{let x;el.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});el.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45){const p=projects.find(p=>p.id===el.dataset.project);slide[p.id]=((slide[p.id]||0)+(d<0?1:-1)+p.photos.length)%p.photos.length;render()}},{passive:true})});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openVideo(Number(b.dataset.play)));document.querySelectorAll('[data-video]').forEach(el=>{el.addEventListener('mouseenter',()=>{if(matchMedia('(hover: none), (prefers-reduced-motion: reduce)').matches)return;previewTimers.set(el,setTimeout(()=>{const f=document.createElement('iframe');f.className='video-preview';f.title=T('Podgląd filmu','Video preview');f.src=embed(el.dataset.video,true);f.allow='autoplay; encrypted-media';el.append(f);const label=document.createElement('span');label.className='preview-label';label.textContent=T('BEZ DŹWIĘKU','MUTED');el.append(label)},650))});el.addEventListener('mouseleave',()=>{clearTimeout(previewTimers.get(el));previewTimers.delete(el);el.querySelectorAll('.video-preview,.preview-label').forEach(e=>e.remove())})});}
function embed(index,auto=false){return `https://www.youtube-nocookie.com/embed/${videos[Number(index)].id}?autoplay=${auto?1:0}&mute=${auto?1:0}&playsinline=1&controls=${auto?0:1}&start=0${auto?'&end=12&loop=1&playlist='+videos[Number(index)].id:''}`}
function openVideo(index){$('#detailContent').innerHTML=`<div class="dialog-head"><div class="eyebrow">MIRELLA I MARCIN / YOUTUBE</div><h2>${L(videos[index].title)}</h2><p>${T('Oglądaj tutaj lub przejdź bezpośrednio do filmu na YouTube.','Watch here or open this video directly on YouTube.')}</p><a class="pill-link" href="https://www.youtube.com/watch?v=${videos[index].id}" target="_blank" rel="noopener">YouTube ↗</a></div><div class="dialog-photos"><iframe src="${embed(index)}" title="Mirella i Marcin YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;showModal()}
function projectDetail(p){$('#detailContent').innerHTML=`<div class="dialog-head"><div class="eyebrow">INTERIOR360 / PORTFOLIO</div><h2>${L(p.title)}</h2><p>${T('Dobry projekt zaczyna się od rozmowy. Projektujemy układ, dobieramy materiały i wyposażenie, a następnie pomagamy przejść przez remont. Chcesz stworzyć podobną przestrzeń? Porozmawiajmy o Twoim domu.','A thoughtful design starts with a conversation. We plan layouts, select materials and furnishings, then help coordinate the renovation. Would you like a space like this? Let’s talk about your home.')}</p>${contact()}<p class="demo">${T('Przykładowa prezentacja projektu — zdjęcia demonstracyjne Unsplash.','Illustrative project presentation — demonstration images from Unsplash.')}</p></div><div class="dialog-photos">${p.photos.map(i=>`<img src="${photo(images[i],1500)}" alt="${L(p.title)} — ${T('przykładowe wnętrze','illustrative interior')}" loading="lazy">`).join('')}</div>`;showModal()}
function showModal(){if(!$('#detail').open)$('#detail').showModal();document.body.style.overflow='hidden';$('#detail').scrollTop=0}
function clearModal(){if($('#detail').open)$('#detail').close();$('#detailContent').innerHTML='';document.body.style.overflow=''}
function closeModal(){clearModal();if(location.hash.includes('/'))location.hash=tab}
$('#detail .close').onclick=closeModal;$('#detail').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function route(){for(const timer of previewTimers.values())clearTimeout(timer);previewTimers.clear();const [part,id]=location.hash.slice(1).split('/');const anchor=part==='rezerwacja'||part==='film';const next=anchor?'konsultacje':['interior360','youtube','konsultacje'].includes(part)?part:(document.body.dataset.entry||'interior360');if(next!==tab){tab=next;query='';window.scrollTo(0,0)}clearModal();render();if(anchor){document.getElementById(part)?.scrollIntoView({block:'start'});return}if(id&&tab==='interior360'){const p=projects.find(p=>p.id===id);if(p)projectDetail(p)}}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;route()});document.querySelectorAll('[data-social]').forEach(b=>b.onclick=()=>toast(T('Link do profilu '+b.dataset.social+' zostanie uzupełniony.','The '+b.dataset.social+' profile link will be added.')));window.addEventListener('hashchange',route);$('#year').textContent=new Date().getFullYear();route();
</script></body></html>
