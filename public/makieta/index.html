function interior(){return `<section class="intro"><div><div class="eyebrow">INTERIOR360 / LET’S MAKE IT</div><h1>${T('Dobre wnętrza.<br><em>Wasze historie.</em>','Thoughtful interiors.<br><em>Your stories.</em>')}</h1></div><div class="intro-copy"><p>${T('Projektujemy wnętrza i koordynujemy remonty.<br>Łączymy pomysł, ludzi i detale — żebyś mógł po prostu<br class="desktop"> poczuć się u siebie. Od pierwszej kreski po ostatni dodatek.','We design interiors and coordinate renovations.<br>Bringing ideas, people and details together, so you can feel at home. From the first sketch to the finishing touch.')}</p>${contact()}</div></section><div class="toolbar"><div class="eyebrow">PORTFOLIO</div><span class="hint">${T('Najedź, by odkryć kolory. Kliknij, by zajrzeć do środka.','Hover to reveal the colours. Click to step inside.')}</span></div><section class="grid" aria-label="Portfolio">${projects.map((p)=>{const n=slide[p.id]||0;return `<article class="card"><div class="picture" data-project="${p.id}"><img src="${photo(images[p.photos[n]])}" alt="${L(p.title)} — ${T('zdjęcie demonstracyjne','illustrative image')}" ${p===projects[0]?'fetchpriority="high"':'loading="lazy"'}><button class="open-project" data-open="${p.id}" aria-label="${T('Otwórz projekt','Open project')}: ${L(p.title)}"><span class="project-tag">${String(projects.indexOf(p)+1).padStart(2,'0')} / INTERIOR360</span></button><button class="pic-arrow prev" data-slide="${p.id}" data-dir="-1" aria-label="${T('Poprzednie zdjęcie','Previous photo')}">←</button><span class="photo-count">${n+1} / ${p.photos.length}</span><a class="choice-link" href="marketplace/#marketplace/${['lampa','fotel','detal','stol'][projects.indexOf(p)%4]}">${T('Wybór Mirelli',"Mirella’s Choice")} ↗</a><button class="pic-arrow next" data-slide="${p.id}" data-dir="1" aria-label="${T('Następne zdjęcie','Next photo')}">→</button></div><a href="#interior360/${p.id}" class="card-meta"><div><h3>${L(p.title)}</h3><p>${L(p.type)}</p></div><span class="arrow">↗</span></a></article>`}).join('')}</section><p class="demo">${T('MAKIETA / Zdjęcia Unsplash i nazwy projektów są przykładowe — do zastąpienia Waszym portfolio.','PROTOTYPE / Unsplash images and project names are illustrative — to be replaced with your portfolio.')}</p><section class="services"><div><strong>${T('Twój pomysł. Nasz wspólny projekt.','Your idea. Our shared project.')}</strong><p>${T('Projektowanie wnętrz &nbsp; / &nbsp; Koordynacja remontu &nbsp; / &nbsp; Wykończenie pod klucz','Interior design &nbsp; / &nbsp; Renovation coordination &nbsp; / &nbsp; Turnkey interiors')}</p></div><a class="pill-link" href="${wa(T('Cześć, porozmawiajmy o moim wnętrzu.','Hello, let’s talk about my interior.'))}" target="_blank" rel="noopener">${T('Porozmawiajmy','Let’s talk')} <span>↗</span></a></section>`}
function youtube(){return `<section class="intro"><div><div class="eyebrow">MIRELLA I MARCIN / PARA W REMONT</div><h1>${T('Wnętrza. Życie.<br><em>I trochę remontu.</em>','Interiors. Life.<br><em>And a little renovation.</em>')}</h1></div><div class="intro-copy"><p>${T('Znacie nas z „Pary w remont” w HGTV. Na YouTube pokazujemy nasze projekty, metamorfozy i przygodę z domem na Sycylii. Jesteśmy małżeństwem — w życiu i przy każdym kolejnym pomyśle.','You may know us from “Para w remont” on HGTV. On YouTube, we share our projects, makeovers and our Sicilian home adventure. Partners in life — and in every new idea.')}</p>${contact()}</div></section><div class="toolbar"><div class="eyebrow">${T('NAJNOWSZE ODCINKI','LATEST EPISODES')}</div><a class="pill-link" href="${CONFIG.channel}" target="_blank" rel="noopener">${T('Najnowsze filmy na YouTube','Latest videos on YouTube')} ↗</a></div><section class="grid">${videos.map(v=>`<article class="card"><div class="picture" data-video="${v.index}"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${L(v.title)}" loading="lazy"><button class="open-project" data-play="${v.index}" aria-label="${T('Odtwórz filmy kanału','Play channel videos')}"><span class="project-tag">${L(v.series)}</span></button><span class="play">▶</span></div><div class="card-meta"><div><h3>${L(v.title)}</h3><p>${T('Mirella i Marcin · zobacz na YouTube','Mirella i Marcin · watch on YouTube')}</p></div><span class="arrow">↗</span></div></article>`).join('')}</section><p class="demo">${T('Odcinki z kanału Mirella i Marcin · stan na 23.10.2026. Podgląd po najechaniu: bez dźwięku.','Episodes from Mirella i Marcin · snapshot: 23 October 2026. Hover preview: muted. Video titles are shown in their original language.')}</p><section class="services"><div><strong>${T('Zróbmy razem coś ciekawego.','Let’s make something interesting.')}</strong><p>${T('Współpraca z markami, wspólne projekty i wnętrza z historią.','Brand collaborations, shared projects and interiors with a story.')}</p></div><a class="pill-link" href="${wa(T('Cześć, chciałbym porozmawiać o współpracy z kanałem Mirella i Marcin.','Hello, I’d like to discuss a collaboration with Mirella i Marcin.'))}" target="_blank" rel="noopener">${T('Porozmawiajmy o współpracy','Let’s collaborate')} ↗</a></section>`}
function shop(){return `<section class="intro"><div><div class="eyebrow">MARKETPLACE / THE INTERIOR360 EDIT</div><h1>${T('Wybór Mirelli.<br><em>Pomysły do Twojego domu.</em>',"Mirella’s Choice.<br><em>Ideas for your home.</em>")}</h1></div><div class="intro-copy"><p>${T('Zobacz wnętrza i wizualizacje, odkryj wybrane meble, światło i dodatki. Potrzebujesz pomocy z własnym wnętrzem? Zamów konsultację online.','Explore interiors and visualisations, then discover selected furniture, lighting and details. Need help with your own space? Book an online consultation.')}</p>${contact()}</div></section><div class="toolbar">${filters([['all','Wszystko','All'],['wybor','Wybór Mirelli',"Mirella’s Choice"],['konsultacje','Konsultacje','Consultations']])}<label><span class="sr-only">${T('Szukaj produktów','Search products')}</span><input id="search" class="shop-search" placeholder="${T('Szukaj inspiracji…','Search inspirations…')}" value="${query.replace(/"/g,'&quot;')}"></label></div><section class="grid" id="products">${productCards()}</section><p class="demo">${T('* Konsultacje osobiste: 200 € + koszt dojazdu do klienta. Kolekcje wyposażenia są przykładowe; linki do produktów wymagają uzupełnienia.','* In-person consultations: €200 + travel expenses to the client. Furnishing collections are illustrative; product links still need adding.')}</p><section class="services"><div><strong>${T('Zapisz ten pomysł. Albo zapytaj nas.','Save the idea. Or ask us.')}</strong><p>${T('Każda kolekcja ma własny link — gotowy do udostępnienia pod filmem.','Every collection has its own link — ready to share below a video.')}</p><button class="pill-link" id="copyShop">${T('Skopiuj link do kolekcji','Copy collection link')} ↗</button></section>`}
function productCards(){const list=products.filter(p=>(filter==='all'||p.category===filter)&&L(p.title).toLocaleLowerCase().includes(query.toLocaleLowerCase()));return list.length?list.map(p=>`<article class="card"><div class="picture"><img src="${photo(p.image)}" alt="${L(p.title)} — ${T('inspiracja przykładowa','illustrative inspiration')}" loading="lazy"><button class="open-project" data-product="${p.id}" aria-label="${L(p.title)}"><span class="project-tag">${p.service?T('KONSULTACJA ONLINE · 200 €','ONLINE CONSULTATION · €200'):T('WYBÓR MIRELLI',"MIRELLA’S CHOICE")}</span></button></div><a href="marketplace/#marketplace/${p.id}" class="card-meta"><div><h3>${L(p.title)}</h3><p>${L(p.sub)}</p></div><span class="arrow">↗</span></a></article>`).join(''):`<p class="empty">${T('Nie znaleziono inspiracji. Spróbuj innego hasła.','No inspirations found. Try another search.')}</p>`}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.hash='interior360/'+b.dataset.open);document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{const p=projects.find(p=>p.id===b.dataset.slide);slide[p.id]=((slide[p.id]||0)+Number(b.dataset.dir)+p.photos.length)%p.photos.length;render()});document.querySelectorAll('[data-project]').forEach(el=>{let x;el.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});el.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45){const p=projects.find(p=>p.id===el.dataset.project);slide[p.id]=((slide[p.id]||0)+(d<0?1:-1)+p.photos.length)%p.photos.length;render()}},{passive:true})});document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>location.hash='marketplace/'+b.dataset.product);document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openVideo(Number(b.dataset.play)));document.querySelectorAll('[data-video]').forEach(el=>{el.addEventListener('mouseenter',()=>{if(matchMedia('(hover: none), (prefers-reduced-motion: reduce)').matches)return;previewTimer=setTimeout(()=>{const f=document.createElement('iframe');f.className='video-preview';f.title=T('Podgląd kanału','Channel preview');f.src=embed(el.dataset.video,true);f.allow='autoplay; encrypted-media';el.append(f);const label=document.createElement('span');label.className='preview-label';label.textContent=T('PODGLĄD KANAŁU · BEZ DŹWIĘKU','CHANNEL PREVIEW · MUTED');el.append(label)},650)});el.addEventListener('mouseleave',()=>{clearTimeout(previewTimer);el.querySelectorAll('.video-preview,.preview-label').forEach(e=>e.remove())})});if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#products').innerHTML=productCards();document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>location.hash='marketplace/'+b.dataset.product)};if($('#copyShop'))$('#copyShop').onclick=()=>copy(location.href)}
function embed(index,auto=false){return `https://www.youtube-nocookie.com/embed/${videos[Number(index)].id}?autoplay=${auto?1:0}&mute=${auto?1:0}&playsinline=1&controls=${auto?0:1}&start=0${auto?'&end=12&loop=1&playlist='+videos[Number(index)].id:''}`}
function openVideo(index){$('#detailContent').innerHTML=`<div class="dialog-head"><div class="eyebrow">MIRELLA I MARCIN / YOUTUBE</div><h2>${L(videos[index].title)}</h2><p>${T('Oglądaj tutaj lub przejdź bezpośrednio do filmu na YouTube.','Watch here or open this video directly on YouTube.')}</p><a class="pill-link" href="https://www.youtube.com/watch?v=${videos[index].id}" target="_blank" rel="noopener">YouTube ↗</a></div><div class="dialog-photos"><iframe src="${embed(index)}" title="Mirella i Marcin YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;showModal()}
function projectDetail(p){$('#detailContent').innerHTML=`<div class="dialog-head"><div class="eyebrow">INTERIOR360 / PORTFOLIO</div><h2>${L(p.title)}</h2><p>${T('Dobry projekt zaczyna się od rozmowy. Projektujemy układ, dobieramy materiały i wyposażenie, a następnie pomagamy przejść przez remont. Chcesz stworzyć podobną przestrzeń? Porozmawiajmy o Twoim domu.','A thoughtful design starts with a conversation. We plan layouts, select materials and furnishings, then help coordinate the renovation. Would you like a space like this? Let’s talk about your home.')}</p>${contact()}<p class="demo">${T('Przykładowa prezentacja projektu — zdjęcia demonstracyjne Unsplash.','Illustrative project presentation — demonstration images from Unsplash.')}</p></div><div class="dialog-photos">${p.photos.map(i=>`<img src="${photo(images[i],1500)}" alt="${L(p.title)} — ${T('przykładowe wnętrze','illustrative interior')}" loading="lazy">`).join('')}</div>`;showModal()}
function productDetail(p){if(p.service){consultationDetail();return}const url=location.href;$('#detailContent').innerHTML=`<div class="dialog-head"><div class="eyebrow">MARKETPLACE / THE INTERIOR360 EDIT</div><h2>${L(p.title)}</h2><p>${T('Wybór Mirelli: inspiracja do urządzenia wnętrza. Tutaj zbierzemy meble, oświetlenie i dodatki widoczne na zdjęciu wraz z linkami do konkretnych produktów.','Mirella’s Choice: an inspiration for your interior. This collection will bring together the furniture, lighting and accessories shown, with links to individual products.')}</p><div class="contact-line"><a class="pill-link" href="${wa(T('Cześć, mam pytanie o: ','Hello, I have a question about: ')+L(p.title)+' '+url)}" target="_blank" rel="noopener">${T('Zapytaj o wyposażenie','Ask about the furnishings')} ↗</a><button class="pill-link" id="copyProduct">${T('Skopiuj link','Copy link')} ↗</button></div><p class="demo">${T('Przykładowa kolekcja — zdjęcie demonstracyjne. Linki do produktów zostaną uzupełnione.','Sample collection — illustrative image. Product links will be added.')}</p></div><div class="dialog-photos"><img src="${photo(p.image,1400)}" alt="${L(p.title)}"></div>`;showModal();$('#copyProduct').onclick=()=>copy(url)}
function consultationDetail(){const url=location.href;$('#detailContent').innerHTML=`<div class="dialog-head"><div class="eyebrow">INTERIOR360 / ${T('KONSULTACJE','CONSULTATIONS')}</div><h2>${T('Zamów konsultację online','Book an online consultation')}</h2><div class="consult-price">200 €</div><p>${T('Porozmawiajmy o Twoim wnętrzu. Omówimy Twoje potrzeby i pytania dotyczące urządzenia domu. Termin oraz zakres konsultacji ustalimy przed zamówieniem.','Let’s talk about your interior, your needs and your questions about furnishing your home. We’ll agree on the scope and appointment before you place an order.')}</p><p class="consult-note">${T('* Konsultacja osobista: 200 € + koszt dojazdu do klienta. Koszt dojazdu ustalamy indywidualnie przed potwierdzeniem spotkania.','* In-person consultation: €200 + travel expenses to the client. Travel expenses are agreed individually before confirming the appointment.')}</p><a class="pill-link" href="${wa(T('Cześć, chcę zamówić konsultację online za 200 €. Proszę o ustalenie terminu i zakresu. ','Hello, I’d like to book an online consultation for €200. Please let me know the available dates and scope. ')+url)}" target="_blank" rel="noopener">${T('Zamów konsultację online','Book an online consultation')} ↗</a><p class="demo">${T('Przycisk otwiera rozmowę na WhatsApp w celu ustalenia zamówienia. Płatność online nie jest jeszcze podłączona.','The button opens WhatsApp to arrange your booking. Online payment is not connected yet.')}</p></div><div class="dialog-photos"><img src="${photo(images[1],1400)}" alt="${T('Przykładowe wnętrze','Illustrative interior')}"></div>`;showModal()}
function showModal(){if(!$('#detail').open)$('#detail').showModal();document.body.style.overflow='hidden';$('#detail').scrollTop=0}
function clearModal(){if($('#detail').open)$('#detail').close();$('#detailContent').innerHTML='';document.body.style.overflow=''}
function closeModal(){clearModal();if(location.hash.includes('/'))location.hash=tab}
$('#detail .close').onclick=closeModal;$('#detail').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function route(){if(location.hash.startsWith('#marketplace')){location.replace('marketplace/'+location.hash);return}clearTimeout(previewTimer);const [part,id]=location.hash.slice(1).split('/');const next=['interior360','youtube','marketplace'].includes(part)?part:'interior360';if(next!==tab){tab=next;filter='all';query='';window.scrollTo(0,0)}clearModal();render();if(id&&tab==='interior360'){const p=projects.find(p=>p.id===id);if(p)projectDetail(p)}if(id&&tab==='marketplace'){const p=products.find(p=>p.id===id);if(p)productDetail(p)}}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}async function copy(url){try{await navigator.clipboard.writeText(url);toast(T('Link skopiowany. Możesz wkleić go pod filmem.','Link copied. You can paste it below a video.'))}catch{toast(url)}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;route()});document.querySelectorAll('[data-social]').forEach(b=>b.onclick=()=>toast(T('Link do profilu '+b.dataset.social+' zostanie uzupełniony.','The '+b.dataset.social+' profile link will be added.')));window.addEventListener('hashchange',route);$('#year').textContent=new Date().getFullYear();route();
</script></body></html>
