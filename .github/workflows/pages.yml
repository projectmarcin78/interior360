name: Publish website
on:
  push:
    branches: [main]
    paths: ['public/**', 'VERSION', 'CHANGELOG.md', 'scripts/prepare-release.mjs', 'scripts/update-youtube-videos.py', '.github/workflows/pages.yml']
  schedule:
    # Monday evening: 19:15 in Poland in winter, 20:15 in summer.
    - cron: '15 18 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refresh latest YouTube videos
        # A feed outage must not block unrelated website releases.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: python3 scripts/update-youtube-videos.py
      - name: Validate and stamp website version
        run: node scripts/prepare-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

